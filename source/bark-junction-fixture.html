<!doctype html><html><meta charset="utf-8"><title>庭院树皮近景对照</title><style>body{margin:0;background:#333;color:#eee;font:14px sans-serif}button{margin:8px;padding:8px}canvas{display:block}pre{margin:8px}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js","three/addons/":"../dist/vendor/three/addons/"}}</script><button id="before" disabled>原树皮</button><button id="after" disabled>修正树皮</button><button id="angle" disabled>树根 / 分枝</button><pre id="result">加载</pre><script type="module">
import * as T from 'three';import {applyBarkJunctions} from '../dist/bark-junctions.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';
try{
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(1280,640);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.83;document.body.append(renderer.domElement);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#72786d');const loader=new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('../dist/vendor/three/addons/libs/draco/gltf/')),tl=new T.TextureLoader();
const [old,current,color,normal,rough,hdr]=await Promise.all([loader.loadAsync('../evidence/bark-junction-original/garden-trees.glb'),loader.loadAsync('../dist/assets/garden-trees.glb?junction=1'),...['pbr-bark.jpg','pbr-bark-normal.jpg','pbr-bark-rough.jpg'].map(n=>tl.loadAsync('../dist/assets/'+n)),new HDRLoader().loadAsync('../dist/assets/autumn-forest.hdr')]);
const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromEquirectangular(hdr).texture;pmrem.dispose();hdr.dispose();scene.environmentRotation.y=.7;scene.environmentIntensity=.8;
color.colorSpace=T.SRGBColorSpace;for(const t of [color,normal,rough]){t.wrapS=t.wrapT=T.RepeatWrapping;t.flipY=false;t.anisotropy=8;}
const material=new T.MeshStandardMaterial({map:color,normalMap:normal,roughnessMap:rough,normalScale:new T.Vector2(.38,.38),roughness:.91,envMapIntensity:.35});
for(const asset of [old,current]){const group=asset.scene;group.traverse(o=>{if(o.isMesh){o.visible=/Garden_tree_02/.test(o.name);o.material=material;if(asset===current&&o.geometry.hasAttribute('_bark_blend')){o.geometry.setAttribute('barkBlend',o.geometry.getAttribute('_bark_blend'));o.material=applyBarkJunctions(material.clone());}o.castShadow=o.receiveShadow=true;}});group.position.set(-10.6,-.08,-10);scene.add(group);}
const sun=new T.DirectionalLight('#ffe7c2',5.2);sun.position.set(-24,21,10);sun.target.position.set(0,2,0);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-5,right:5,top:7,bottom:-3,near:.1,far:60});sun.shadow.normalBias=.012;sun.shadow.bias=-.0001;scene.add(sun,sun.target,new T.HemisphereLight('#d2e5ee','#3a4329',.3));
const floor=new T.Mesh(new T.PlaneGeometry(20,20),new T.MeshStandardMaterial({color:'#4e5440',roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const camera=new T.PerspectiveCamera(43,2,.05,80);let enabled=false,angle=1;
function draw(){old.scene.visible=!enabled;current.scene.visible=enabled;const views=[[[1.5,1,2.6],[0,.65,0]],[[1.2,2.2,2],[0,2.15,0]],[[5,4.4,7],[0,3,0]]];camera.position.set(...views[angle][0]);camera.lookAt(...views[angle][1]);renderer.render(scene,camera);document.querySelector('#result').textContent=JSON.stringify({forkBlend:enabled,angle,visible:current.scene.children.filter(o=>o.visible).map(o=>o.name)});}
document.querySelector('#before').onclick=()=>{enabled=false;draw();};document.querySelector('#after').onclick=()=>{enabled=true;draw();};document.querySelector('#angle').onclick=()=>{angle=(angle+1)%3;draw();};for(const b of document.querySelectorAll('button'))b.disabled=false;draw();
}catch(e){document.querySelector('#result').textContent=e.stack;console.error(e);}
</script></html>
