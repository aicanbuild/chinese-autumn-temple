<!doctype html><html lang="en"><meta charset="utf-8"><title>Pond sunlight validation</title><style>body{background:#222;color:#ddd;font:14px monospace}canvas{width:480px;height:480px}pre{white-space:pre-wrap}</style><h1>Underwater sunlight: pixel validation</h1><pre id="result">Rendering…</pre><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js"}}</script><script type="module">
import * as THREE from 'three';import {installPondOptics} from '../dist/pond-optics.js';import {installBoundedLocalLighting} from '../dist/local-lighting.js';installBoundedLocalLighting();
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(160,160);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
const scene=new THREE.Scene(),floor=new THREE.Mesh(new THREE.PlaneGeometry(8,8),new THREE.MeshStandardMaterial({color:'#8e8a74',roughness:.8}));floor.rotation.x=-Math.PI/2;floor.position.set(0,-.9,5.8);floor.receiveShadow=true;floor.userData.waterSide='below';scene.add(floor);
const camera=new THREE.OrthographicCamera(-2,2,2,-2,.01,20);camera.position.set(0,.1,5.8);camera.up.set(0,0,-1);camera.lookAt(0,-.9,5.8);
const sun=new THREE.DirectionalLight('#fff0d8',1.7);sun.position.set(0,9,5.8);sun.target.position.set(0,-1,5.8);sun.castShadow=true;sun.shadow.mapSize.set(512,512);Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:.1,far:75});sun.shadow.bias=-.00001;scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight('#c0dae4',.4);fill.position.set(4,4,-3);scene.add(fill);const point=new THREE.PointLight('#ffa564',6,6);point.position.set(0,-.2,5.8);scene.add(point);
const blocker=new THREE.Mesh(new THREE.BoxGeometry(12,.1,12),new THREE.MeshStandardMaterial());blocker.position.set(0,.5,5.8);blocker.castShadow=true;blocker.visible=false;scene.add(blocker);
const maps=[0,1].map(()=>{const t=new THREE.DataTexture(new Uint8Array([0,0,0,255]),1,1);t.needsUpdate=true;return t;});const time={value:0},optics=installPondOptics(scene,maps,time,sun),target=new THREE.WebGLRenderTarget(160,160);
function render(){optics.update();renderer.setRenderTarget(target);renderer.render(scene,camera);const p=new Uint8Array(160*160*4);renderer.readRenderTargetPixels(target,0,0,160,160,p);return p;}
function density(n){maps.forEach(t=>{t.image.data.set([n,n,n,255]);t.needsUpdate=true;});}
function compare(a,b){let changed=0,max=0,total=0;for(let i=0;i<a.length;i+=4){let d=0;for(let j=0;j<3;j++){const v=Math.abs(a[i+j]-b[i+j]);max=Math.max(max,v);d+=v;}total+=d/3;if(d>3)changed++;}return {changedPixels:changed,maxChannelDifference:max,meanDifference:total/(160*160)};}
const cases=[];
for(const name of ['sunlit underwater','sun off, local and fill lights only','above water','outside pond','fully shadowed underwater']){
 sun.intensity=name==='sun off, local and fill lights only'?0:1.7;floor.position.set(name==='outside pond'?15:0,name==='above water'?.15:-.9,5.8);camera.position.set(floor.position.x,name==='above water'?1:.1,5.8);camera.lookAt(floor.position.x,floor.position.y,5.8);blocker.visible=name==='fully shadowed underwater';
 density(0);const low=render();density(255);const high=render();const difference=compare(low,high);cases.push({name,...difference,passed:name==='sunlit underwater'?difference.changedPixels>10000:difference.maxChannelDifference<=1});
}
blocker.visible=false;floor.position.set(0,-.9,5.8);camera.position.set(0,.1,5.8);camera.lookAt(0,-.9,5.8);sun.intensity=1.7;sun.position.set(-24,21,10);sun.target.position.set(0,0,-1);
const loader=new THREE.TextureLoader();const loaded=await Promise.all([0,1].map(i=>loader.loadAsync('../dist/assets/pond-caustics-'+i+'.png')));for(let i=0;i<2;i++){const c=document.createElement('canvas');c.width=c.height=1024;const ctx=c.getContext('2d');ctx.drawImage(loaded[i].image,0,0);/* Reallocate immutable GL storage when replacing the 1x1 fixture with a 1K map. */maps[i].dispose();maps[i].image={data:ctx.getImageData(0,0,1024,1024).data,width:1024,height:1024};maps[i].needsUpdate=true;}
const still=render();time.value=8;const moving=render();const motion=compare(still,moving);
const report={passed:cases.every(c=>c.passed)&&motion.changedPixels>1000,cases,animatedActualMaps:motion,scope:'160x160 actual WebGL pixels; same receiver and lighting, only density maps or time changed'};document.querySelector('#result').textContent=JSON.stringify(report,null,2);renderer.setRenderTarget(null);renderer.render(scene,camera);
</script></html>
