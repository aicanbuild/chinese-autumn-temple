<!doctype html><meta charset="utf-8"><title>Pond transmittance verification</title>
<script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js"}}</script>
<pre id="result">Computing paired water-path transmission…</pre>
<script type="module">
import * as T from 'three';
import {pondTransmittanceGLSL,POND_EXTINCTION} from '../dist/water-medium.js';
const renderer=new T.WebGLRenderer();renderer.setSize(1,1);renderer.toneMapping=T.NoToneMapping;
const target=new T.WebGLRenderTarget(1,1,{type:T.FloatType,depthBuffer:false});
const paths={value:new T.Vector2()},scene=new T.Scene(),camera=new T.OrthographicCamera(-1,1,1,-1,0,1);
const material=new T.ShaderMaterial({uniforms:{paths},vertexShader:'void main(){gl_Position=vec4(position.xy,0.,1.);}',fragmentShader:`uniform vec2 paths;${pondTransmittanceGLSL()}void main(){gl_FragColor=vec4(pondBeamTransmittance(paths.x)*pondBeamTransmittance(paths.y),1.);}`});
scene.add(new T.Mesh(new T.PlaneGeometry(2,2),material));const pixels=new Float32Array(4);let maximumError=0,maximumOldError=0,cases=0;
for(const depth of [.025,.25,.875,1.6])for(const sunAltitude of [10,30,60,90])for(const viewAltitude of [10,45,85]){
 const underwaterCos=alt=>Math.sqrt(1-(Math.cos(alt*Math.PI/180)/1.333)**2);
 const incoming=depth/underwaterCos(sunAltitude),outgoing=depth/underwaterCos(viewAltitude);
 paths.value.set(incoming,outgoing);renderer.setRenderTarget(target);renderer.render(scene,camera);renderer.readRenderTargetPixels(target,0,0,1,1,pixels);
 for(let c=0;c<3;c++){
  // Independent finely subdivided attenuation rather than calling the shader's exponential.
  const steps=65536,step=1-POND_EXTINCTION[c]*(incoming+outgoing)/steps;let expected=1;
  for(let i=0;i<steps;i++)expected*=step;
  maximumError=Math.max(maximumError,Math.abs(pixels[c]-expected));
  const old=Math.exp(-[.25,.075,.045][c]*incoming-POND_EXTINCTION[c]*outgoing);maximumOldError=Math.max(maximumOldError,Math.abs(old-expected));
 }cases++;
}
const report={cases,maximumError,maximumOldError,passed:maximumError<.00002};
document.querySelector('#result').textContent=JSON.stringify(report,null,2);document.body.dataset.result=JSON.stringify(report);
if(!report.passed)throw new Error('Pond medium GPU verification failed');target.dispose();material.dispose();renderer.dispose();
</script>
