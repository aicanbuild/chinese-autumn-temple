<!doctype html><html><meta charset="utf-8"><title>水面高光像素过滤核对</title><style>body{background:#222;color:#ddd;font:13px monospace}pre{white-space:pre-wrap}</style><button id="run">验证移动稳定性</button><pre id="result">准备中…</pre><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js"}}</script><script type="module">
import * as T from 'three';import {waterSunSpecularGLSL} from '../dist/water-optics.js?specular=2';
const renderer=new T.WebGLRenderer({antialias:false});renderer.setSize(256,256);renderer.setPixelRatio(1);renderer.toneMapping=T.NoToneMapping;document.body.append(renderer.domElement);const loader=new T.TextureLoader(),maps=await Promise.all([0,1].map(n=>loader.loadAsync('../dist/assets/pond-ripples-'+n+'.png')));maps.forEach(t=>{t.wrapS=t.wrapT=T.RepeatWrapping;});
const camera=new T.PerspectiveCamera(48,1,.05,80);camera.position.set(4,3.5,0);camera.lookAt(0,0,0);const scene=new T.Scene(),uniforms={map0:{value:maps[0]},map1:{value:maps[1]},phase:{value:0},filterStrength:{value:1}};
const material=new T.ShaderMaterial({uniforms,vertexShader:'varying vec3 p;void main(){vec4 w=modelMatrix*vec4(position,1.);p=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',fragmentShader:`#include <common>\nuniform sampler2D map0,map1;uniform float phase,filterStrength;varying vec3 p;${waterSunSpecularGLSL()}\nvoid main(){vec2 uv=p.xz*.25+vec2(phase*.003,phase*.001);vec3 c=mix(texture2D(map0,uv).xyz,texture2D(map1,uv+vec2(.017,.004)).xyz,.5);vec3 n=normalize(vec3((c.x*2.-1.)*.42,max(c.z*2.-1.,.001),(c.y*2.-1.)*.42)),v=normalize(cameraPosition-p),l=normalize(vec3(-4.,3.5,0.)),h=normalize(v+l),delta=n-h;float variance=.25*(dot(dFdx(delta),dFdx(delta))+dot(dFdy(delta),dFdy(delta)))*filterStrength;float value=pondSunSpecular(n,v,l,variance,.02037318784);gl_FragColor=vec4(vec3(value),1.);}`});const plane=new T.Mesh(new T.PlaneGeometry(80,80),material);plane.rotation.x=-Math.PI/2;scene.add(plane);
const low=new T.WebGLRenderTarget(128,128,{type:T.FloatType}),high=new T.WebGLRenderTarget(1024,1024,{type:T.FloatType});
function capture(target,filterStrength){uniforms.filterStrength.value=filterStrength;renderer.setRenderTarget(target);renderer.render(scene,camera);const pixels=new Float32Array(target.width*target.height*4);renderer.readRenderTargetPixels(target,0,0,target.width,target.height,pixels);return pixels;}
document.querySelector('#result').textContent='128² 实时采样，对照 1024² 的每像素 64 个样本';
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;const samples=[];for(let frame=0;frame<12;frame++){await new Promise(requestAnimationFrame);uniforms.phase.value=frame*.67;const ref=capture(high,0),raw=capture(low,0),filtered=capture(low,1);let rawError=0,filteredError=0,refEnergy=0,rawEnergy=0,filteredEnergy=0;for(let y=0;y<128;y++)for(let x=0;x<128;x++){let expected=0;for(let j=0;j<8;j++)for(let i=0;i<8;i++)expected+=ref[((y*8+j)*1024+x*8+i)*4]/64;const k=(y*128+x)*4;rawError+=(Math.log1p(raw[k])-Math.log1p(expected))**2;filteredError+=(Math.log1p(filtered[k])-Math.log1p(expected))**2;refEnergy+=expected;rawEnergy+=raw[k];filteredEnergy+=filtered[k];}samples.push({frame,rawRMSE:Math.sqrt(rawError/16384),filteredRMSE:Math.sqrt(filteredError/16384),refEnergy,rawEnergy,filteredEnergy});}
const mean=key=>samples.reduce((s,p)=>s+p[key],0)/samples.length;document.querySelector('#result').textContent=JSON.stringify({improved:mean('filteredRMSE')<mean('rawRMSE'),meanRawRMSE:mean('rawRMSE'),meanFilteredRMSE:mean('filteredRMSE'),samples,scope:'12 moving wave phases; log-radiance RMSE against 8x8 spatial supersampling of the unfiltered GGX lobe. Isolated sun lobe, not full-scene temporal AA.'},null,2);renderer.setRenderTarget(null);uniforms.filterStrength.value=1;renderer.render(scene,camera);document.querySelector('#run').disabled=false;};renderer.render(scene,camera);
</script></html>
