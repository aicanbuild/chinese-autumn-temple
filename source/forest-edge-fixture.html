<!doctype html><meta charset="utf-8"><title>林缘地被对照</title><style>body{margin:0;background:#30382d;color:#eee;font:12px sans-serif}button{margin:6px;padding:7px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js","three/addons/":"../dist/vendor/three/addons/"}}</script><button id="before">原林缘</button><button id="after">新增地被</button><button id="angle">切换机位</button><pre id="stats">加载</pre><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';import {installForestEdge} from '../dist/forest-edge.js';import {installGardenGround} from '../dist/garden-ground.js';import {createLandscape} from '../dist/landscape.js';import {installUnderstory} from '../dist/understory.js';
try{
const r=new T.WebGLRenderer({antialias:true});r.setSize(850,620);r.setPixelRatio(1);r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=.83;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;document.body.append(r.domElement);const scene=new T.Scene();scene.background=new T.Color('#8c9b9b');scene.fog=new T.FogExp2('#8c9b9b',.006);const cam=new T.PerspectiveCamera(50,850/620,.07,200);
const loader=new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('../dist/vendor/three/addons/libs/draco/gltf/'));const [terrain,wood,shrubs,ferns,layout,trees,oldLayout,hdr]=await Promise.all(['terrain','woodland','understory','fern/fern-cutout'].map(n=>loader.loadAsync('../dist/assets/'+n+'.glb')).concat(['forest-edge','woodland','understory'].map(n=>fetch('../dist/assets/'+n+'.json').then(r=>r.json())),[new HDRLoader().loadAsync('../dist/assets/autumn-forest.hdr')]));
const manager=new T.LoadingManager();manager.setURLModifier(url=>url.startsWith('./assets/')?'../dist/'+url.slice(2):url);await installGardenGround(terrain.scene,manager);const pm=new T.PMREMGenerator(r);scene.environment=pm.fromEquirectangular(hdr).texture;scene.environmentIntensity=.8;scene.environmentRotation.y=.7;pm.dispose();hdr.dispose();createLandscape(terrain.scene,wood.scene,{trees:trees.trees.filter(p=>Math.hypot(p[0],p[1])<70)},scene,{perTreeCulling:true});installUnderstory(shrubs.scene,oldLayout,scene);
const plain=installForestEdge(shrubs.scene,ferns.scene,layout,scene),culled=installForestEdge(shrubs.scene,ferns.scene,layout,scene,{perPlantCulling:true});
const sun=new T.DirectionalLight('#ffe7c2',5.2);sun.position.set(-24,21,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-58,right:58,top:58,bottom:-58,near:.1,far:180});sun.shadow.normalBias=.015;sun.shadow.bias=-.00012;scene.add(sun,sun.target,new T.HemisphereLight('#d2e5ee','#3a4329',.3));
scene.updateMatrixWorld(true);const ray=new T.Raycaster(),down=new T.Vector3(0,-1,0);function ground(x,z){ray.set(new T.Vector3(x,120,z),down);return ray.intersectObject(terrain.scene,true)[0].point.y;}
let angle=0,enabled=true,culling=true;const close=layout.plants.find(p=>p[5]==='fern'&&p[0]>27&&p[0]<33&&p[1]<-5&&p[1]>-16);const views=[[[18,2.4,13],[32,4,4]],[[-19,2.5,12],[-35,5,5]],[[close[0]-2,ground(close[0]-2,-close[1]+2)+1,-close[1]+2],[close[0],close[2]+.3,-close[1]]]];
function draw(){for(const m of plain.batches)m.visible=enabled&&!culling;for(const m of culled.batches)m.visible=enabled&&culling;cam.position.set(...views[angle][0]);cam.lookAt(...views[angle][1]);r.render(scene,cam);const data={enabled,culling,angle,plants:layout.plants.length,plantBatches:culled.batches.length,calls:r.info.render.calls,triangles:r.info.render.triangles};document.querySelector('#stats').textContent=JSON.stringify(data);r.domElement.dataset.stats=JSON.stringify(data);}
const target=new T.WebGLRenderTarget(850,620),proof=[];for(let v=0;v<3;v++){angle=v;const pair=[];for(const mode of [false,true]){culling=mode;r.setRenderTarget(target);draw();const pixels=new Uint8Array(850*620*4);r.readRenderTargetPixels(target,0,0,850,620,pixels);pair.push({pixels,triangles:r.info.render.triangles,calls:r.info.render.calls});}let changed=0,max=0,over2=0;for(let i=0;i<pair[0].pixels.length;i++){const d=Math.abs(pair[0].pixels[i]-pair[1].pixels[i]);if(d)changed++;if(d>2)over2++;max=Math.max(max,d);}proof.push({angle:v,changed,max,channelsOver2:over2,fullTriangles:pair[0].triangles,culledTriangles:pair[1].triangles,fullCalls:pair[0].calls,culledCalls:pair[1].calls});}r.setRenderTarget(null);target.dispose();r.domElement.dataset.cullingProof=JSON.stringify(proof);angle=0;culling=true;

</script>
