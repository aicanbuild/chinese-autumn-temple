<!doctype html><html><meta charset="utf-8"><title>壁画嵌框接触光照对照</title><style>body{margin:0;background:#222;color:#ddd;font:13px monospace}button{margin:6px;padding:8px}pre{white-space:pre-wrap}#benchResult{max-height:120px;overflow:auto}canvas{display:block}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js","three/addons/":"../dist/vendor/three/addons/"}}</script><button id="before" disabled>原壁画</button><button id="after" disabled>接触遮蔽</button><button id="angle" disabled>切换机位</button><pre id="result">加载…</pre><pre id="benchResult"></pre><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';

try{
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(1280,640);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.83;renderer.info.autoReset=false;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.append(renderer.domElement);

const [temple,sanctuary,floor,sculpture,vessel,brocade,doors,layout,hdr,atlas,contactLayout]=await Promise.all(['temple','sanctuary','sanctuary-floor','sculpture','incense-vessel','altar-brocade','door-backs'].map(n=>loader.loadAsync('../dist/assets/'+n+'.glb')).concat([fetch('../dist/assets/sanctuary.json').then(r=>r.json()),new HDRLoader().loadAsync('../dist/assets/autumn-forest.hdr'),new T.TextureLoader().loadAsync('../dist/assets/mural-contact-ao.png'),fetch('../dist/assets/mural-contact-ao.json').then(r=>r.json())]));

temple.scene.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true;});scene.add(temple.scene);
function oldFastenerHits(){temple.scene.updateWorldMatrix(true,true);const materials=new Map();temple.scene.traverse(o=>{if(o.isMesh&&!materials.has(o.material)){materials.set(o.material,o.material.side);o.material.side=T.DoubleSide;}});const result=[-2.8,2.8].map(x=>{const ray=new T.Raycaster(new T.Vector3(x,3.75,-10.1387),new T.Vector3(0,0,1),0,.05);return ray.intersectObject(temple.scene,true).length;});for(const [m,side]of materials)m.side=side;return result;}
function oldFastenerVertices(){const counts=[0,0],p=new T.Vector3();temple.scene.updateWorldMatrix(true,true);temple.scene.traverse(o=>{if(!o.isMesh||!o.material.name.includes('gilded'))return;const a=o.geometry.attributes.position;for(let i=0;i<a.count;i++){p.fromBufferAttribute(a,i).applyMatrix4(o.matrixWorld);if(Math.abs(p.y-3.75)>.06||Math.abs(p.z+10.145)>.06)continue;for(let k=0;k<2;k++)if(Math.abs(p.x-[-2.8,2.8][k])<.06)counts[k]++;}});return counts;}
const fastenersBefore=oldFastenerHits(),fastenerVerticesBefore=oldFastenerVertices();
installSanctuaryFloor(temple.scene,floor.scene,scene);installSanctuary(temple.scene,sanctuary.scene,layout,scene).update(12);const fastenersAfter=oldFastenerHits(),fastenerVerticesAfter=oldFastenerVertices();if(fastenerVerticesAfter.some(n=>n!==0))throw new Error("Legacy fastener vertices remain");if(fastenersBefore.some(n=>n===0)||fastenersAfter.some(n=>n!==0))throw new Error('Legacy wall fastener removal did not match actual GLB');const contact=installMuralContact(sanctuary.scene,atlas,contactLayout);installIncenseVessel(temple.scene,vessel.scene,scene);installAltarBrocade(brocade.scene,scene);installDoorBacks(doors.scene,sanctuary.scene,scene);sculpture.scene.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true;});scene.add(sculpture.scene);
const key=createSanctuaryLighting(scene),sun=new T.DirectionalLight('#ffe7c2',5.2),hemi=new T.HemisphereLight('#d2e5ee','#3a4329',.3);sun.position.set(-24,21,10);sun.target.position.set(0,0,-1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:.5,far:75});sun.shadow.bias=-.00035;sun.shadow.normalBias=.027;scene.add(sun,sun.target,hemi);
captureHallReflections(renderer,scene,[sanctuary.scene,floor.scene,sculpture.scene,vessel.scene,brocade.scene],{exclude:[sculpture.scene,vessel.scene],projections:new Map([[floor.scene,{min:new T.Vector3(-6.14,.939,-10.74),max:new T.Vector3(6.14,4.3,-3.46)}]])});
const views=[[[.08,2.72,-4.02],[0,2.9,-8.35],66],[[-3.95,3.5,-8.8],[-4.42,3.47,-10.139],55],[[3.95,3.5,-8.8],[4.42,3.47,-10.139],55],[[-4.15,3.65,-7.9],[-5.3,3.72,-7.87],55],[[4.15,3.65,-7.9],[5.3,3.72,-7.87],55]],camera=new T.PerspectiveCamera(66,2,.09,420);let angle=0,enabled=true;
function draw(){for(const mesh of contact.meshes)mesh.material.aoMapIntensity=enabled?.85:0;camera.position.set(...views[angle][0]);camera.lookAt(...views[angle][1]);camera.fov=views[angle][2];camera.updateProjectionMatrix();renderer.shadowMap.needsUpdate=true;key.key.shadow.needsUpdate=true;renderer.info.reset();renderer.render(scene,camera);document.querySelector('#result').textContent=JSON.stringify({mode:enabled?'contact':'original',angle,...contact.stats,triangles:renderer.info.render.triangles,calls:renderer.info.render.calls});}
function difference(a,b){let changed=0,darker=0,lighter=0,max=0;for(let i=0;i<a.length;i++){const d=b[i]-a[i];if(d){changed++;if(d<0)darker++;else lighter++;max=Math.max(max,Math.abs(d));}}return {changedChannels:changed,darkerChannels:darker,lighterChannels:lighter,maxDifference:max};}
const target=new T.WebGLRenderTarget(1280,640),comparisons=[];
function sample(){renderer.setRenderTarget(target);draw();const pixels=new Uint8Array(1280*640*4),shadow=new Uint8Array(2048*2048*4);renderer.readRenderTargetPixels(target,0,0,1280,640,pixels);renderer.readRenderTargetPixels(key.key.shadow.map,0,0,2048,2048,shadow);return {pixels,shadow,triangles:renderer.info.render.triangles,calls:renderer.info.render.calls};}
for(angle=0;angle<views.length;angle++){enabled=false;const before=sample();enabled=true;const after=sample();comparisons.push({view:angle,color:difference(before.pixels,after.pixels),shadow:difference(before.shadow,after.shadow),beforeTriangles:before.triangles,afterTriangles:after.triangles,beforeCalls:before.calls,afterCalls:after.calls});await new Promise(r=>setTimeout(r,0));}

const environment=scene.environment,hemiIntensity=hemi.intensity,saved=contact.meshes.map(o=>o.material.envMap);scene.environment=null;hemi.intensity=0;for(const o of contact.meshes){o.material.envMap=null;o.material.needsUpdate=true;}angle=1;enabled=false;const directBefore=sample();enabled=true;const directAfter=sample();const directOnly=difference(directBefore.pixels,directAfter.pixels);
scene.environment=environment;hemi.intensity=hemiIntensity;contact.meshes.forEach((o,i)=>{o.material.envMap=saved[i];o.material.needsUpdate=true;});renderer.setRenderTarget(null);angle=0;enabled=true;draw();document.querySelector('#benchResult').textContent=JSON.stringify({comparisons,directOnly,fastenersBefore,fastenersAfter,fastenerVerticesBefore,fastenerVerticesAfter},null,2);
for(const id of ['before','after','angle'])document.querySelector('#'+id).disabled=false;document.querySelector('#before').onclick=()=>{enabled=false;draw();};document.querySelector('#after').onclick=()=>{enabled=true;draw();};document.querySelector('#angle').onclick=()=>{angle=(angle+1)%views.length;draw();};
}catch(e){document.querySelector('#result').textContent=e.stack;console.error(e);}
