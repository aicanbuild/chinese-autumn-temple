<!doctype html><meta charset="utf-8"><title>水下折射阴影验证</title><style>body{margin:0;background:#303c37;color:#eee;font:13px sans-serif}button{padding:8px;margin:8px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js"}}</script><button id="before">空气直线阴影</button><button id="after">水下折射阴影</button><pre id="stats">载入</pre><script type="module">
import * as T from 'three';import {installPondShadows} from '../dist/pond-shadows.js?test=2';
const scene=new T.Scene();scene.background=new T.Color('#39483c');const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1000,700);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const camera=new T.OrthographicCamera(-4,4,2.8,-2.8,.1,30);camera.position.set(0,10,5.8);camera.up.set(0,0,-1);camera.lookAt(0,-1.3,5.8);
const sun=new T.DirectionalLight('#fff5df',3);sun.position.set(-8,6,5.8);sun.target.position.set(0,0,5.8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:.1,far:25});sun.shadow.bias=-.00003;sun.shadow.normalBias=.001;scene.add(sun,sun.target,new T.HemisphereLight('#d0e6ff','#343924',.1));
const bed=new T.Mesh(new T.PlaneGeometry(8,5.6,32,32),new T.MeshStandardMaterial({color:'#ddddc3',roughness:1}));bed.rotation.x=-Math.PI/2;bed.position.set(0,-1.3,5.8);bed.receiveShadow=true;scene.add(bed);
const fish=new T.Mesh(new T.SphereGeometry(.12,24,16),new T.MeshStandardMaterial({color:'#ed8735',roughness:.7}));fish.position.set(0,-.45,5);fish.castShadow=true;fish.receiveShadow=true;scene.add(fish);
const beam=new T.Mesh(new T.BoxGeometry(.18,.18,.5),new T.MeshStandardMaterial({color:'#bb391c'}));beam.position.set(-1,1,6.5);beam.castShadow=true;scene.add(beam);
const optics=installPondShadows(scene,sun),target=new T.WebGLRenderTarget(1000,700);const images=[];const direction=new T.Vector3(-.8,.6,0),waterSlope=(.8/1.333)/Math.sqrt(1-(.8/1.333)**2),expected={fish:[.85*waterSlope,-1.3,5],beam:[-1+1.025*(.8/.6)+1.275*waterSlope,-1.3,6.5]};
function render(on){optics.enabled=on;renderer.shadowMap.needsUpdate=true;renderer.render(scene,camera);document.querySelector('#stats').textContent=JSON.stringify({enabled:on,expectedShadowCenters:expected,casters:optics.casters.length});}
for(const on of [false,true]){renderer.setRenderTarget(target);render(on);const pixels=new Uint8Array(1000*700*4);renderer.readRenderTargetPixels(target,0,0,1000,700,pixels);images.push(pixels);}
const proof={};for(const [name,position] of Object.entries(expected)){const p=new T.Vector3(...position).project(camera),x=Math.round((p.x*.5+.5)*1000),y=Math.round((p.y*.5+.5)*700);proof[name]=images.map(pixels=>[...pixels.slice((y*1000+x)*4,(y*1000+x)*4+3)]);}
renderer.setRenderTarget(null);target.dispose();renderer.domElement.dataset.proof=JSON.stringify(proof);document.querySelector('#before').onclick=()=>render(false);document.querySelector('#after').onclick=()=>render(true);render(true);
</script>
