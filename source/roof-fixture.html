<!doctype html><html><meta charset="utf-8"><style>body{margin:0;background:#b4bcaa}#tools{position:fixed;bottom:15px;left:15px;z-index:2;background:white;padding:10px;font:13px monospace}button{margin:4px}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js","three/addons/":"../dist/vendor/three/addons/"}}</script><div id="tools"><button id="authored">Authored</button><button id="noenv">No environment</button><button id="plain">Plain grey</button><button id="normals">Normals</button><button id="uncolored">No vertex color</button><button id="untextured">No color map</button><pre id="report"></pre></div><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.83;document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#b4bcaa');const camera=new T.PerspectiveCamera(43,innerWidth/innerHeight,.1,200);camera.position.set(14,11,16);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,6,-7);controls.update();scene.add(new T.HemisphereLight('#d2e5ee','#3a4329',.30));const sun=new T.DirectionalLight('#ffe7c2',5.2);sun.position.set(-24,21,10);sun.target.position.set(0,0,-1);scene.add(sun,sun.target);

const grey=new T.MeshStandardMaterial({color:'#808080',roughness:1,envMapIntensity:0,side:T.DoubleSide}),normal=new T.MeshNormalMaterial({side:T.DoubleSide});const colors=mesh.geometry.attributes.color;let tintMin=Infinity,tintMax=-Infinity,channelSpread=0;for(let i=0;i<colors.count;i++){const r=colors.getX(i),g=colors.getY(i),b=colors.getZ(i);tintMin=Math.min(tintMin,r,g,b);tintMax=Math.max(tintMax,r,g,b);channelSpread=Math.max(channelSpread,Math.abs(r-g),Math.abs(g-b));}const colorAudit={tintMin,tintMax,channelSpread};const colorMap=original.map;const report=document.querySelector('#report');function mode(name){original.vertexColors=name!=='uncolored';original.map=name==='untextured'?null:colorMap;original.needsUpdate=true;mesh.material=name==='plain'?grey:name==='normals'?normal:original;original.envMapIntensity=name==='noenv'?0:.55;report.textContent=JSON.stringify({colorAudit,mode:name,type:mesh.material.type,color:mesh.material.color?.toArray(),roughness:mesh.material.roughness,metalness:mesh.material.metalness,vertexColors:mesh.material.vertexColors,texture:mesh.material.map?.name,color0:mesh.geometry.attributes.color?Array.from(mesh.geometry.attributes.color.array.slice(0,12)):null},null,2);}for(const id of ['authored','noenv','plain','normals','uncolored','untextured'])document.getElementById(id).onclick=()=>mode(id);mode('authored');renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
