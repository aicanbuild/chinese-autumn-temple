<!doctype html><html lang="zh"><meta charset="utf-8"><title>木鱼槌摆放检查</title><style>body{margin:0;background:#292722;color:#ead9b9;font:13px sans-serif}canvas{display:block}nav{position:absolute;bottom:18px;left:18px}button{padding:10px;margin-right:6px}.hidden{display:none}output{display:block;margin-top:8px}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js","three/addons/":"../dist/vendor/three/addons/"}}</script>
<nav><button id="take">拿起木鱼</button><button id="strike">敲一下</button><button id="return-muyu" class="hidden">放回木鱼</button><button id="angle">切换侧面</button><output id="result">加载…</output></nav>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';import {createWoodenFish} from '../dist/wooden-fish.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.85;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#292722');scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,50);
scene.add(new THREE.HemisphereLight('#fff0da','#302114',2));const light=new THREE.DirectionalLight('#ffe3b4',3);light.position.set(0,4,-4);scene.add(light);
const asset=await new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('../dist/vendor/three/addons/libs/draco/gltf/')).loadAsync('../dist/assets/wooden-fish.glb?pose=rest1');let hits=0,side=false;const fish=createWoodenFish(asset.scene,scene,camera,()=>hits++);function angle(){camera.position.set(side?-.05:-.55,side?1.88:2.34,side?-6.1:-5.6);camera.lookAt(-.95,1.69,-6.45);}angle();
document.querySelector('#take').onclick=()=>fish.take();document.querySelector('#strike').onclick=()=>fish.strike();document.querySelector('#angle').onclick=()=>{side=!side;angle();};
let last=performance.now();function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;fish.update(dt);renderer.render(scene,camera);fish.render(renderer);document.querySelector('#result').textContent=JSON.stringify({...fish.stats,hits});requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
