<!doctype html><html><meta charset="utf-8"><title>水下折射求解效率对照</title><style>body{margin:0;background:#222;color:#ddd;font:13px monospace}pre{white-space:pre-wrap}button{margin:6px;padding:8px}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js","./water-refraction-adaptive-experiment.js":"./water-refraction-adaptive-experiment.js?v=bfbc91da6dc7","three/addons/":"../dist/vendor/three/addons/"}}</script><button id="before" disabled>固定五步</button><button id="after" disabled>精度达标即停止</button><button id="angle" disabled>切换机位</button><button id="bench" disabled>对照中</button><pre id="benchResult"></pre><pre id="result">加载…</pre><script type="module">
import {createGpuProfiler} from '../dist/gpu-profiler.js';
import {waterProjectionGLSL as referenceGLSL} from './water-refraction-reference.js';
import {waterProjectionGLSL} from './water-refraction-adaptive-experiment.js';
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';import {Water} from 'three/addons/objects/Water2.js';import {installPondBasin} from '../dist/pond-basin.js';import {installPondStones} from '../dist/pond-stones.js';import {replaceBridge} from '../dist/bridge.js';import {createKoi,updateKoi} from '../dist/koi.js';import {installPondOptics} from '../dist/pond-optics.js';import {installWaterRefraction} from './water-refraction-adaptive-experiment.js';import {depthWaterFragment} from '../dist/water-optics.js';import {impactWaterFragment,createPondMotion} from '../dist/pond-motion.js';import {createWaterVisibility} from '../dist/water-visibility.js';import {createWaterCaptureRegion} from '../dist/water-capture-region.js';
try{
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(1280,640);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.83;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#879184');const loader=new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('../dist/vendor/three/addons/libs/draco/gltf/'));const texture=new T.TextureLoader();
const [temple,bridge,basin,stones,koi,layout,hdr,n0,n1,c0,c1]=await Promise.all(['temple','bridge','pond-basin','pond-stones','koi/koi'].map(n=>loader.loadAsync('../dist/assets/'+n+'.glb')).concat([fetch('../dist/assets/pond-stones.json').then(r=>r.json()),new HDRLoader().loadAsync('../dist/assets/autumn-forest.hdr')],['pond-ripples-0.png','pond-ripples-1.png','pond-caustics-0.png','pond-caustics-1.png'].map(n=>texture.loadAsync('../dist/assets/'+n))));
const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromEquirectangular(hdr).texture;pmrem.dispose();hdr.dispose();scene.environmentRotation.y=.7;scene.environmentIntensity=.8;
temple.scene.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;}});scene.add(temple.scene);replaceBridge(temple.scene,bridge.scene,scene);installPondBasin(temple.scene,basin.scene);installPondStones(temple.scene,stones.scene,layout,scene);
let seed=73;const fish=createKoi(koi.scene,scene,()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296;});updateKoi(fish,18);
const sun=new T.DirectionalLight('#ffe7c2',5.2);sun.position.set(-24,21,10);sun.target.position.set(0,0,-1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:.5,far:75});sun.shadow.bias=-.00035;sun.shadow.normalBias=.027;scene.add(sun,sun.target,new T.HemisphereLight('#d2e5ee','#3a4329',.3));installPondOptics(scene,[c0,c1],{value:18},sun).update();
const shape=new T.Shape();shape.absellipse(0,0,11.48,6.88,0,Math.PI*2,false,0);const waters=[],regions=[];let visibility,refractionProjection,profiler,enabled=true;
for(const refraction of [true]){const index=waters.length;const water=new Water(new T.ShapeGeometry(shape,128),{shader:{...Water.WaterShader,fragmentShader:impactWaterFragment(depthWaterFragment(Water.WaterShader.fragmentShader,{refraction}))},normalMap0:n0,normalMap1:n1,refractionDepth:true,textureWidth:1536,textureHeight:1536,scale:.25,flowSpeed:0,reflectivity:.025,captureFilter:mode=>{const end=mode==='refraction'?profiler?.begin(enabled?'adaptive':'fixed'):null;const a=visibility?.capture(mode),b=refraction?refractionProjection?.capture(mode):null;return()=>{b?.();a?.();end?.();};},captureRegion:(mode,camera,target)=>regions[index]?.capture(mode,camera,target)});water.rotation.x=-Math.PI/2;water.position.set(0,-.025,5.8);createPondMotion(water.material,sun).update(18);water.visible=false;scene.add(water);waters.push(water);}
refractionProjection=installWaterRefraction(scene);visibility=createWaterVisibility(scene,-.025);for(const water of waters)regions.push(createWaterCaptureRegion(water,scene));
const camera=new T.PerspectiveCamera(48,2,.09,100);let angle=0;
const materials=new Set();scene.traverse(o=>{if(o.isMesh&&!o.isWater)for(const m of Array.isArray(o.material)?o.material:[o.material])materials.add(m);});
for(const m of materials){const compile=m.onBeforeCompile,key=m.customProgramCacheKey();m.onBeforeCompile=shader=>{compile.call(m,shader);if(!enabled)shader.vertexShader=shader.vertexShader.replace(waterProjectionGLSL,referenceGLSL);};m.customProgramCacheKey=()=>key+(enabled?'|adaptive':'|fixed');}
function draw(){for(const m of materials)m.needsUpdate=true;waters[0].visible=true;const views=[[[11,5,14],[2,-.3,6]],[[5,1.3,13],[0,-.2,5]],[[1,9,7],[1,-1,6]],[[12,2,4],[5,-.2,5]],[[0,.25,12],[0,-.2,5]],[[14,8.5,26],[0,2,0]]];camera.position.set(...views[angle][0]);camera.lookAt(...views[angle][1]);camera.updateProjectionMatrix();renderer.render(scene,camera);document.querySelector('#result').textContent=JSON.stringify({mode:enabled?'depth refraction':'normal offset',angle,region:regions[0].stats,triangles:renderer.info.render.triangles,calls:renderer.info.render.calls});}
for(const id of ['before','after','angle','bench'])document.querySelector('#'+id).disabled=false;document.querySelector('#before').onclick=()=>{enabled=false;draw();};document.querySelector('#after').onclick=()=>{enabled=true;draw();};document.querySelector('#angle').onclick=()=>{angle=(angle+1)%6;draw();};draw();

const target=new T.WebGLRenderTarget(1280,640),comparisons=[];
for(angle=0;angle<6;angle++){
 const images=[];for(const mode of [false,true]){enabled=mode;renderer.setRenderTarget(target);draw();const pixels=new Uint8Array(1280*640*4);renderer.readRenderTargetPixels(target,0,0,1280,640,pixels);images.push(pixels);}
 let channels=0,over4=0,max=0,sum=0;for(let i=0;i<images[0].length;i++){const d=Math.abs(images[0][i]-images[1][i]);channels+=d>0;over4+=d>4;max=Math.max(max,d);sum+=d;}
 comparisons.push({view:angle,changedChannels:channels,channelsAbove4:over4,maxDifference:max,meanAbsoluteDifference:sum/images[0].length});
 document.querySelector('#benchResult').textContent=JSON.stringify({comparisons});await new Promise(r=>setTimeout(r,0));
}
renderer.setRenderTarget(null);angle=5;for(let i=0;i<8;i++){enabled=!!(i%2);draw();await new Promise(requestAnimationFrame);}
profiler=createGpuProfiler(renderer.getContext(),{interval:1,windowSize:100,targets:['fixed','adaptive']});
for(let i=0;i<72;i++){enabled=!!(i%2);profiler.beginFrame();draw();profiler.endFrame();await new Promise(requestAnimationFrame);}
for(let i=0;i<8;i++){profiler.beginFrame();profiler.endFrame();await new Promise(requestAnimationFrame);}
document.querySelector('#benchResult').textContent=JSON.stringify({comparisons,gpu:profiler.stats},null,2);document.querySelector('#bench').disabled=true;
}catch(e){document.querySelector('#result').textContent=e.stack;console.error(e);}
</script></html>
