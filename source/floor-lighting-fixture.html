<!doctype html><html><meta charset="utf-8"><title>石铺地环境光对照</title><style>body{margin:0;background:#222;color:#ddd;font:13px monospace}pre{white-space:pre-wrap;padding:10px}button{padding:8px;margin:8px}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js","three/addons/":"../dist/vendor/three/addons/"}}</script><button id="before" disabled>原地面天光</button><button id="after" disabled>殿内地面光</button><button id="vase" disabled>查看门口</button><pre id="result">加载…</pre><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';import {createLandscape} from '../dist/landscape.js';import {installSanctuary} from '../dist/sanctuary.js';import {createSanctuaryLighting} from '../dist/sanctuary-lighting.js';import {installIncenseVessel} from '../dist/incense-vessel.js';import {installSanctuaryFloor} from '../dist/sanctuary-floor.js';import {captureHallReflections} from '../dist/hall-reflections.js';
try{
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(1280,640);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.83;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#879184');const loader=new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('../dist/vendor/three/addons/libs/draco/gltf/'));
const [temple,sanctuary,terrain,woodland,sculpture,vessel,floor,forest,layout,hdr]=await Promise.all(['temple','sanctuary','terrain','woodland','sculpture','incense-vessel','sanctuary-floor'].map(n=>loader.loadAsync('../dist/assets/'+n+'.glb')).concat(['woodland','sanctuary'].map(n=>fetch('../dist/assets/'+n+'.json').then(r=>r.json())),[new HDRLoader().loadAsync('../dist/assets/autumn-forest.hdr')]));
const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromEquirectangular(hdr).texture;pmrem.dispose();hdr.dispose();scene.environmentRotation.y=.7;scene.environmentIntensity=.8;
temple.scene.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;}});scene.add(temple.scene);installSanctuary(temple.scene,sanctuary.scene,layout,scene).update(12);installSanctuaryFloor(temple.scene,floor.scene,scene);createLandscape(terrain.scene,woodland.scene,forest,scene).update(12);createSanctuaryLighting(scene);installIncenseVessel(temple.scene,vessel.scene,scene);sculpture.scene.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;}});scene.add(sculpture.scene);

const camera=new T.PerspectiveCamera(66,2,.09,420),saved=new Map();for(const root of [floor.scene])root.traverse(o=>{if(o.isMesh&&!saved.has(o.material))saved.set(o.material,{map:o.material.envMap,intensity:o.material.envMapIntensity,before:o.material.onBeforeCompile,key:o.material.customProgramCacheKey});});
const probe=captureHallReflections(renderer,scene,[sanctuary.scene,sculpture.scene,vessel.scene,floor.scene],{exclude:[sculpture.scene,vessel.scene],projections:new Map([[floor.scene,{min:new T.Vector3(-6.14,.939,-10.74),max:new T.Vector3(6.14,4.3,-3.46)}]])});const after=new Map([...saved].map(([m])=>[m,{before:m.onBeforeCompile,key:m.customProgramCacheKey}]));let enabled=true,close=false;
function draw(){for(const [m,p]of saved){m.envMap=enabled?probe.target.texture:p.map;m.envMapIntensity=enabled?1:p.intensity;m.onBeforeCompile=enabled?after.get(m).before:p.before;m.customProgramCacheKey=enabled?after.get(m).key:p.key;m.needsUpdate=true;}camera.position.set(...(close?[3.8,2.25,-7.0]:[.08,2.72,-4.02]));camera.lookAt(...(close?[0,1.07,-3.6]:[0,2.9,-8.35]));camera.fov=66;camera.updateProjectionMatrix();scene.traverse(o=>{if(o.isLight&&o.castShadow)o.shadow.needsUpdate=true;});renderer.render(scene,camera);document.querySelector('#result').textContent=JSON.stringify({mode:enabled?'interior reflection':'outdoor reflection',...probe.stats,triangles:renderer.info.render.triangles,calls:renderer.info.render.calls});}
for(const id of ['before','after','vase'])document.querySelector('#'+id).disabled=false;document.querySelector('#before').onclick=()=>{enabled=false;draw();};document.querySelector('#after').onclick=()=>{enabled=true;draw();};document.querySelector('#vase').onclick=()=>{close=!close;draw();};draw();
}catch(e){document.querySelector('#result').textContent=e.stack;console.error(e);}
</script></html>
