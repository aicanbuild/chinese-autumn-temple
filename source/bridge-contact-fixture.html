<!doctype html><meta charset="utf-8"><title>木桥接缝光照对照</title><style>body{margin:0;background:#343a33;color:#eee;font:12px sans-serif}button{margin:6px;padding:8px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js","three/addons/":"../dist/vendor/three/addons/"}}</script><button id="before">原环境光</button><button id="after">接缝遮蔽</button><button id="angle">切换机位</button><pre id="stats">加载</pre><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';import {replaceBridge} from '../dist/bridge.js?contact=2';
try{
const r=new T.WebGLRenderer({antialias:true});r.setSize(1000,640);r.setPixelRatio(1);r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=.83;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;document.body.append(r.domElement);
const scene=new T.Scene();scene.background=new T.Color('#586452');const cam=new T.PerspectiveCamera(40,1000/640,.02,80);
const loader=new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('../dist/vendor/three/addons/libs/draco/gltf/'));
const [asset,hdr]=await Promise.all([loader.loadAsync('../dist/assets/bridge.glb?contact=2'),new HDRLoader().loadAsync('../dist/assets/autumn-forest.hdr')]);
const pm=new T.PMREMGenerator(r);scene.environment=pm.fromEquirectangular(hdr).texture;scene.environmentIntensity=.8;scene.environmentRotation.y=.7;pm.dispose();hdr.dispose();replaceBridge(new T.Group(),asset.scene,scene);const meshes=[];asset.scene.traverse(o=>{if(o.isMesh)meshes.push(o)});
const sun=new T.DirectionalLight('#ffe7c2',5.2);sun.position.set(-24,21,10);sun.target.position.set(0,1,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-9,right:9,top:8,bottom:-8,near:.1,far:65});sun.shadow.normalBias=.003;sun.shadow.bias=-.00005;const hemi=new T.HemisphereLight('#d2e5ee','#3a4329',.3);scene.add(sun,sun.target,hemi);
let angle=0,on=true;const views=[[[0,1.8,12.8],[1.23,1.15,10.3]],[[-.3,1.1,12.4],[1.25,.85,11.7]],[[3,2.1,13],[1.25,1.3,10.9]],[[0,1.95,13],[0,1.15,6]]];
function draw(){cam.position.set(...views[angle][0]);cam.lookAt(...views[angle][1]);for(const m of meshes)m.material.userData.bridgeContactStrength.value=on?1:0;r.render(scene,cam);const data={enabled:on,angle,drawCalls:r.info.render.calls,triangles:r.info.render.triangles,attributes:meshes.map(m=>({count:m.geometry.getAttribute('_bridge_occlusion')?.count}))};document.querySelector('#stats').textContent=JSON.stringify(data);r.domElement.dataset.stats=JSON.stringify(data);}
const target=new T.WebGLRenderTarget(1000,640),proof=[];
for(let v=0;v<views.length;v++){angle=v;const pair=[];scene.environmentIntensity=0;hemi.intensity=0;
 for(const enabled of [false,true]){on=enabled;r.setRenderTarget(target);draw();const pixels=new Uint8Array(1000*640*4);r.readRenderTargetPixels(target,0,0,1000,640,pixels);pair.push(pixels);}
 let changed=0,max=0;for(let i=0;i<pair[0].length;i++){const d=Math.abs(pair[0][i]-pair[1][i]);if(d)changed++;max=Math.max(max,d);}proof.push({angle:v,changedDirectLightChannels:changed,max});}
r.setRenderTarget(null);target.dispose();scene.environmentIntensity=.8;hemi.intensity=.3;angle=0;on=true;r.domElement.dataset.directLightProof=JSON.stringify(proof);
document.querySelector('#before').onclick=()=>{on=false;draw();};document.querySelector('#after').onclick=()=>{on=true;draw();};document.querySelector('#angle').onclick=()=>{angle=(angle+1)%views.length;draw();};draw();
}catch(e){document.querySelector('#stats').textContent=e.stack;console.error(e);}
</script>
