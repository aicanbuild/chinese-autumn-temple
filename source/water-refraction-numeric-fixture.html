import * as T from 'three';import {waterProjectionGLSL} from './water-refraction-adaptive-experiment.js';
try{
const renderer=new T.WebGLRenderer(),width=128,height=64,count=width*height,data=new Float32Array(count*4);let seed=4781;const random=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296;},log=(a,b)=>Math.exp(Math.log(a)+random()*Math.log(b/a));
for(let i=0;i<count;i++){data[4*i]=log(.000001,150);data[4*i+1]=log(.0011,80);data[4*i+2]=log(.00001,8);}
const input=new T.DataTexture(data,width,height,T.RGBAFormat,T.FloatType);input.needsUpdate=true;input.minFilter=input.magFilter=T.NearestFilter;
const source=waterProjectionGLSL.replace('for(int i=0;i<5;i++){','for(int i=0;i<5;i++){iterations+=1.;').replace('if(abs(residual)*D>.00002*.38){','if(abs(residual)*D>.00002*.38){fallback=1.;');
const material=new T.ShaderMaterial({depthTest:false,depthWrite:false,uniforms:{samples:{value:input},waterInterfaceY:{value:0},waterRefractionPass:{value:1}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',fragmentShader:'uniform sampler2D samples; varying vec2 vUv;float iterations=0.,fallback=0.;\n'+source+'\nvoid main(){vec3 q=texture2D(samples,vUv).xyz;vec3 result=waterSurfaceExit(vec3(q.x,-q.z,0.),vec3(0.,q.y,0.));gl_FragColor=vec4(result.x,iterations,fallback,1.);}'});
const scene=new T.Scene();scene.add(new T.Mesh(new T.PlaneGeometry(2,2),material));const target=new T.WebGLRenderTarget(width,height,{type:T.FloatType,depthBuffer:false});renderer.setRenderTarget(target);renderer.render(scene,new T.Camera());const output=new Float32Array(count*4);renderer.readRenderTargetPixels(target,0,0,width,height,output);
let worst={error:0},fallback=0,totalIterations=0,over20um=0,invalid=0;const histogram={};
for(let i=0;i<count;i++){
 const [L,H,D]=data.subarray(i*4,i*4+3);let lo=0,hi=L;for(let j=0;j<80;j++){const x=(lo+hi)/2;const gradient=x/Math.hypot(x,H)-1.333*(L-x)/Math.hypot(L-x,D);if(gradient>0)hi=x;else lo=x;}
 const expected=(lo+hi)/2,actual=output[i*4],error=Math.abs(actual-expected),iterations=output[i*4+1];if(error>worst.error)worst={error,L,H,D,actual,expected,iterations,fallback:output[i*4+2]};if(!Number.isFinite(error)||output[i*4+3]!==1)invalid++;if(error>.00002)over20um++;fallback+=output[i*4+2];totalIterations+=iterations;histogram[iterations]=(histogram[iterations]??0)+1;
}
document.querySelector('#result').textContent=JSON.stringify({count,invalid,worst,over20um,fallback,meanIterations:totalIterations/count,histogram,passed:invalid===0&&worst.error<.0005},null,2);
}catch(e){document.querySelector('#result').textContent=e.stack;console.error(e);}
</script>
