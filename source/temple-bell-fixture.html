<!doctype html><html lang="zh"><meta charset="utf-8"><title>寺钟近景验证</title><style>body{margin:0;background:#1b2420;color:#ede5cd;font:16px sans-serif}canvas{display:block}button{position:absolute;top:20px;left:20px;padding:12px}pre{position:absolute;bottom:8px;left:16px;font-size:13px}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js","three/addons/":"../dist/vendor/three/addons/"}}</script><button id="ring">敲钟</button><pre id="state"></pre><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {createTempleBell} from '../dist/temple-bell.js';
const loader=new GLTFLoader();loader.setDRACOLoader(new DRACOLoader().setDecoderPath('../dist/vendor/three/addons/libs/draco/gltf/'));const asset=await loader.loadAsync('../dist/assets/temple-bell.glb');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(1280,720);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#26322c');const camera=new THREE.PerspectiveCamera(36,1280/720,.1,30);camera.position.set(-5.9,2.8,-.3);camera.lookAt(-8.4,2.55,-4.1);scene.add(new THREE.HemisphereLight('#fff1d1','#393d3a',1.3));const sun=new THREE.DirectionalLight('#ffe0a2',3);sun.position.set(-6,6,-2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.target.position.set(-8,2,-4);scene.add(sun,sun.target);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.MeshStandardMaterial({color:'#637267',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.set(-8,.85,-4);floor.receiveShadow=true;scene.add(floor);
let sounds=0;const bell=createTempleBell(asset.scene,scene,()=>sounds++);document.querySelector('#ring').onclick=()=>bell.ring();let previous=performance.now();function frame(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;bell.update(dt);renderer.render(scene,camera);document.querySelector('#state').textContent=JSON.stringify({parts:bell.parts,rings:bell.rings,impactEvents:sounds,hammer:asset.scene.getObjectByName('Bell_Hammer').position.toArray(),ropes:[0,1].map(i=>asset.scene.getObjectByName('Bell_Rope_'+i).rotation.z)},null,2);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
