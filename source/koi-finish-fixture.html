<!doctype html><meta charset="utf-8"><title>锦鲤鱼身与鳞片近景</title><style>body{margin:0;background:#263734;color:#eee;font:12px sans-serif}button{margin:7px;padding:8px}canvas{display:block}pre{white-space:pre-wrap}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js","three/addons/":"../dist/vendor/three/addons/"}}</script><button id="before">原鱼身材质</button><button id="after">精修鱼身材质</button><button id="angle">切换机位</button><button id="kind">切换花色</button><pre id="stats">加载…</pre><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';
try{const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(1100,620);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.83;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#243a35');const camera=new T.PerspectiveCamera(38,1100/620,.01,30);const loader=new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('../dist/vendor/three/addons/libs/draco/gltf/'));const [before,after,hdr]=await Promise.all([loader.loadAsync('../evidence/koi-before-finish.glb'),loader.loadAsync('../dist/assets/koi/koi.glb?finish=gill-v2'),new HDRLoader().loadAsync('../dist/assets/autumn-forest.hdr')]);const pm=new T.PMREMGenerator(renderer);scene.environment=pm.fromEquirectangular(hdr).texture;scene.environmentIntensity=.8;scene.environmentRotation.y=.7;hdr.dispose();pm.dispose();const sun=new T.DirectionalLight('#ffe7c2',3.2);sun.position.set(-3,5,2);scene.add(sun,new T.HemisphereLight('#d2e5ee','#3a4329',.3));const versions=[before.scene,after.scene],kinds=['kohaku','sanke','yamabuki','platinum'];for(const [i,root] of versions.entries()){root.traverse(o=>{if(!o.isMesh)return;const m=o.material;m.envMapIntensity=.28;if(m.normalMap)m.normalScale.setScalar(i?1:.27);if(m.map)m.map.anisotropy=8;if(m.name.includes('fin')){m.side=T.DoubleSide;m.depthWrite=false;m.alphaTest=.05;m.forceSinglePass=true;}});scene.add(root);}
let refined=true,kind=0,angle=0;const views=[[[1.05,1.35,1.35],[0,0,-.15]],[[1.8,.25,.95],[0,0,-.12]],[[.5,.48,.87],[0,0,.18]],[[0,2.2,.1],[0,0,-.12]]];function draw(){versions.forEach((root,i)=>{root.visible=i===(refined?1:0);for(const k of kinds)root.getObjectByName('Koi_'+k).visible=k===kinds[kind];});camera.position.set(...views[angle][0]);camera.lookAt(...views[angle][1]);renderer.render(scene,camera);document.querySelector('#stats').textContent=JSON.stringify({refined,kind:kinds[kind],angle,triangles:renderer.info.render.triangles,calls:renderer.info.render.calls});}
document.querySelector('#before').onclick=()=>{refined=false;draw();};document.querySelector('#after').onclick=()=>{refined=true;draw();};document.querySelector('#angle').onclick=()=>{angle=(angle+1)%4;draw();};document.querySelector('#kind').onclick=()=>{kind=(kind+1)%4;draw();};draw();}catch(e){document.querySelector('#stats').textContent=e.stack;console.error(e);}
</script>
