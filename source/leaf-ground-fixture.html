<!doctype html><html><meta charset="utf-8"><title>落叶与真实土面接触对照</title><style>body{margin:0;background:#252921;color:#eee;font:13px monospace}button{margin:8px;padding:8px}pre{max-height:110px;overflow:auto;margin:8px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js","three/addons/":"../dist/vendor/three/addons/"}}</script><button id="before" disabled>旧统一高度</button><button id="after" disabled>实际地形接触</button><pre id="result">加载</pre><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';import {createGroundSurface} from '../dist/ground-surface.js';import {createFallenLeafGeometry,applyLeafSurface} from '../dist/leaf-surfaces.js';import {supportHeight} from '../dist/sweep-motion.js';
try{
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(1280,640);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.83;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.append(renderer.domElement);
const loader=new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('../dist/vendor/three/addons/libs/draco/gltf/')),tl=new T.TextureLoader();
const [terrain,temple,hdr,...textures]=await Promise.all([loader.loadAsync('../dist/assets/terrain.glb'),loader.loadAsync('../dist/assets/temple.glb'),new HDRLoader().loadAsync('../dist/assets/autumn-forest.hdr'),...['maple','ginkgo'].flatMap(n=>['','-normal','-surface'].map(s=>tl.loadAsync('../dist/assets/'+n+'-leaf'+s+'.png')))]);
const scene=new T.Scene();scene.background=new T.Color('#a7b6a9');const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromEquirectangular(hdr).texture;pmrem.dispose();hdr.dispose();scene.environmentRotation.y=.7;scene.environmentIntensity=.8;
terrain.scene.traverse(o=>{if(o.isMesh){o.receiveShadow=true;o.material.roughness=.94;o.material.envMapIntensity=.35;}});scene.add(terrain.scene);temple.scene.traverse(o=>{if(o.isMesh){o.visible=['Honed silver granite','Polished ebony cedar'].includes(o.material?.name);o.castShadow=o.receiveShadow=true;}});scene.add(temple.scene);
const ground=createGroundSurface([{root:terrain.scene},{root:temple.scene,include:o=>['Honed silver granite','Polished ebony cedar'].includes(o.material?.name),maxHeight:1.5}]);
const targets=[];terrain.scene.traverse(o=>{if(o.isMesh)targets.push(o);});temple.scene.traverse(o=>{if(o.isMesh&&['Honed silver granite','Polished ebony cedar'].includes(o.material?.name))targets.push(o);});
const ray=new T.Raycaster(new T.Vector3(),new T.Vector3(0,-1,0),0,100);let samples=0,maxError=0;
for(let x=-14.6;x<15;x+=.79)for(let z=-11.6;z<14;z+=.83){const height=ground.heightAt(x,z);if(height===null)continue;ray.ray.origin.set(x,50,z);const hit=ray.intersectObjects(targets,false).find(h=>h.face.normal.clone().transformDirection(h.object.matrixWorld).y>.35&&(!['Honed silver granite','Polished ebony cedar'].includes(h.object.material.name)||h.point.y<=1.5));if(!hit)throw new Error('Missing reference hit');maxError=Math.max(maxError,Math.abs(height-hit.point.y));samples++;}
const leaves=[];for(let i=0;i<8;i++){const kind=i%2,map=textures[kind*3];map.colorSpace=T.SRGBColorSpace;const material=applyLeafSurface(new T.MeshStandardMaterial({map,alphaTest:.42,side:T.DoubleSide}),{normal:textures[kind*3+1],surface:textures[kind*3+2]});const mesh=new T.Mesh(createFallenLeafGeometry(kind,Math.floor(i/2)%3),material);mesh.rotation.set(-Math.PI/2,0,i*.73);mesh.scale.setScalar(.18);mesh.position.set(-8.0+(i%4-1.5)*.25,0,-1.3+(Math.floor(i/4)-.5)*.3);mesh.castShadow=mesh.receiveShadow=true;scene.add(mesh);leaves.push(mesh);}
const sun=new T.DirectionalLight('#ffe7c2',5.2);sun.position.set(-16,12,3);sun.target.position.set(-8.0,0,-1.3);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-2,right:2,top:2,bottom:-2,near:.1,far:40});sun.shadow.bias=-.00003;sun.shadow.normalBias=.001;scene.add(sun,sun.target,new T.HemisphereLight('#d2e5ee','#3a4329',.3));
const camera=new T.PerspectiveCamera(39,2,.02,1000);camera.position.set(-6.8,.77,.5);camera.lookAt(-8.0,.26,-1.3);
let enabled=false;const gaps=[];for(const mesh of leaves){const p=mesh.geometry.attributes.position;const y=supportHeight(p,mesh.rotation,.18,mesh.position.x,mesh.position.z,(x,z)=>ground.heightAt(x,z)??0);const rotation=new T.Matrix4().makeRotationFromEuler(mesh.rotation),v=new T.Vector3();let min=Infinity;for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).multiplyScalar(.18).applyMatrix4(rotation);min=Math.min(min,y+v.y-ground.heightAt(mesh.position.x+v.x,mesh.position.z+v.z));}gaps.push(min);}
const oldGround=leaves.map(m=>.385-ground.heightAt(m.position.x,m.position.z));const start=performance.now();let checksum=0;for(let i=0;i<100000;i++)checksum+=ground.heightAt(-14.7+(i%199)*.147,-11.8+(i%173)*.147)??0;const sampleMs=performance.now()-start;
const report={raycastSamples:samples,maxHeightError:maxError,vertexContactGaps:gaps,oldCenterFloatingGaps:oldGround,sampler:ground.stats,sample100kMilliseconds:sampleMs,checksum};if(maxError>1e-6||gaps.some(g=>Math.abs(g-.002)>1e-7))throw new Error(JSON.stringify(report));
function draw(){for(const mesh of leaves)mesh.position.y=enabled?supportHeight(mesh.geometry.attributes.position,mesh.rotation,.18,mesh.position.x,mesh.position.z,(x,z)=>ground.heightAt(x,z)??0):.387;renderer.render(scene,camera);document.querySelector('#result').textContent=JSON.stringify({mode:enabled?'actual terrain':'old flat height',...report},null,2);}
document.querySelector('#before').onclick=()=>{enabled=false;draw();};document.querySelector('#after').onclick=()=>{enabled=true;draw();};for(const b of document.querySelectorAll('button'))b.disabled=false;draw();
}catch(e){document.querySelector('#result').textContent=e.stack;console.error(e);}
</script></html>
