<!doctype html><meta charset="utf-8"><title>薄叶透光验证</title><style>body{margin:0;background:#292e28;color:#eee;font:12px sans-serif}button{margin:6px;padding:7px}canvas{display:block}pre{white-space:pre-wrap;max-width:1000px}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js","three/addons/":"../dist/vendor/three/addons/"}}</script><button id="before">原不透光材质</button><button id="after">薄叶透光</button><button id="angle">切换机位</button><pre id="stats">加载</pre><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';import {applyFoliageLighting} from '../dist/foliage-lighting.js';import {applyWoodlandWind} from '../dist/foliage-wind.js';
try{
const r=new T.WebGLRenderer({antialias:true});r.setSize(950,570);r.setPixelRatio(1);r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=.85;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;document.body.append(r.domElement);
// Isolated radiometric checks have no environment light or post effects.
const s=new T.Scene(),c=new T.OrthographicCamera(-1,1,1,-1,.1,20);c.position.set(0,0,4);c.lookAt(0,0,0);const m=applyFoliageLighting(new T.MeshStandardMaterial({color:'#60952e',roughness:1,side:T.DoubleSide}),.27),leaf=new T.Mesh(new T.PlaneGeometry(1,1),m);leaf.castShadow=true;leaf.receiveShadow=true;s.add(leaf);const light=new T.DirectionalLight('#fff',3);light.castShadow=true;light.shadow.mapSize.set(1024,1024);light.shadow.camera.left=-2;light.shadow.camera.right=2;light.shadow.camera.top=2;light.shadow.camera.bottom=-2;light.shadow.camera.near=.1;light.shadow.camera.far=20;light.shadow.bias=-.00001;light.shadow.normalBias=.001;s.add(light,light.target);const blocker=new T.Mesh(new T.PlaneGeometry(2,2),new T.MeshStandardMaterial({side:T.DoubleSide}));blocker.position.z=-1;blocker.castShadow=true;blocker.visible=false;s.add(blocker);
const target=new T.WebGLRenderTarget(96,96,{type:T.FloatType});const proof={};r.setRenderTarget(target);const read=()=>{r.render(s,c);const p=new Float32Array(96*96*4);r.readRenderTargetPixels(target,0,0,96,96,p);let sum=0;for(let y=38;y<58;y++)for(let x=38;x<58;x++){const i=(y*96+x)*4;sum+=.2126*p[i]+.7152*p[i+1]+.0722*p[i+2];}return sum/400;};
for(const kind of ['directional','point','spot']){
 s.remove(light);const lamp=kind==='directional'?light:kind==='point'?new T.PointLight('#fff',75,30,2):new T.SpotLight('#fff',75,30,Math.PI/4,0,2);lamp.castShadow=true;lamp.shadow.mapSize.set(1024,1024);lamp.shadow.bias=-.00001;lamp.shadow.normalBias=.001;lamp.shadow.camera.near=.1;lamp.shadow.camera.far=20;s.add(lamp);if(lamp.target)s.add(lamp.target);const result={};
 for(const direction of ['front','back']){lamp.position.set(0,0,direction==='front'?5:-5);for(const enabled of [false,true]){m.userData.foliageTransmission.value=enabled?.27:0;result[direction+(enabled?'Thin':'Opaque')]=read();}}
 blocker.visible=true;result.blocked=read();blocker.visible=false;lamp.intensity=0;result.dark=read();s.remove(lamp);if(lamp.target)s.remove(lamp.target);proof[kind]=result;
 if(!(result.backThin>result.backOpaque+.01&&result.frontThin<result.frontOpaque&&result.blocked<result.backThin*.03&&result.dark<.0001))throw new Error('Transport check failed '+kind+' '+JSON.stringify(result));
}
// Compile simultaneous mixed lights and repeated lights after Three unrolls loops.
const mixed=[new T.DirectionalLight('#fff',1),new T.DirectionalLight('#fff',1),new T.PointLight('#fff',20),new T.SpotLight('#fff',20)];
for(const lamp of mixed){lamp.position.set(0,0,-5);lamp.castShadow=true;lamp.shadow.mapSize.set(256,256);lamp.shadow.normalBias=.001;s.add(lamp);if(lamp.target)s.add(lamp.target);}
proof.mixedBack=read();if(!(proof.mixedBack>.01))throw new Error('Mixed lighting failed');
r.setRenderTarget(null);target.dispose();

const scene=new T.Scene();scene.background=new T.Color('#6c7970');scene.fog=new T.FogExp2('#6c7970',.012);const camera=new T.PerspectiveCamera(44,950/570,.05,100);const sun=new T.DirectionalLight('#ffdfad',4.8);sun.position.set(-2,5,-5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:.1,far:40});sun.shadow.bias=-.00008;sun.shadow.normalBias=.002;scene.add(sun,sun.target,new T.HemisphereLight('#d2e2e5','#313822',.5));
const floor=new T.Mesh(new T.PlaneGeometry(40,40),new T.MeshStandardMaterial({color:'#343a28',roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.y=-.015;floor.receiveShadow=true;scene.add(floor);
const loader=new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('../dist/vendor/three/addons/libs/draco/gltf/'));const [ferns,shrubs,wood]=await Promise.all(['fern/fern-cutout','understory','woodland'].map(n=>loader.loadAsync('../dist/assets/'+n+'.glb')));const materials=[];const hdr=await new HDRLoader().loadAsync('../dist/assets/autumn-forest.hdr');const pm=new T.PMREMGenerator(r);scene.environment=pm.fromEquirectangular(hdr).texture;scene.environmentIntensity=.8;pm.dispose();hdr.dispose();
function add(root,x,z,width,fraction,wind=false,batched=false){root.updateMatrixWorld(true);const rootBounds=new T.Box3().setFromObject(root),rootCenter=rootBounds.getCenter(new T.Vector3()),rootWidth=rootBounds.max.x-rootBounds.min.x;root.traverse(p=>{if(!p.isMesh)return;const g=p.geometry.clone().applyMatrix4(p.matrixWorld);g.computeBoundingBox();g.translate(-rootCenter.x,-rootBounds.min.y,-rootCenter.z);g.scale(width/rootWidth,width/rootWidth,width/rootWidth);const mat=p.material.clone();mat.envMapIntensity=.4;mat.side=T.DoubleSide;mat.transparent=false;mat.forceSinglePass=true;mat.alphaTest=mat.map?.name?.includes('spray')?.42:mat.alphaTest;mat.roughness=.9;if(p.name.startsWith('fern')){mat.color.set('#b3bd83');mat.alphaTest=.5;}const isLeaf=!p.name.includes('twig')&&!p.name.startsWith('Branch');if(isLeaf){if(wind){mat.onBeforeCompile=shader=>applyWoodlandWind(shader,{value:0});mat.customProgramCacheKey=()=> 'woodland-fixture';}applyFoliageLighting(mat,fraction);materials.push(mat);}const mesh=batched?new T.BatchedMesh(1,g.attributes.position.count,g.index?.count??0,mat):new T.InstancedMesh(g,mat,1);const matrix=new T.Matrix4().makeTranslation(x,0,z);if(batched){mesh.sortObjects=false;mesh.setMatrixAt(mesh.addInstance(mesh.addGeometry(g)),matrix);}else mesh.setMatrixAt(0,matrix);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);});}
add(ferns.scene.children[0],-1.15,.8,1.7,.27);add(ferns.scene.children[1],.15,.1,1.4,.27,false,true);add(shrubs.scene.getObjectByName('Understory_0'),1.25,-.5,1.65,.16);add(wood.scene.getObjectByName('Woodland_0_0'),-2.8,-3.8,2.7,.20,true,true);
let enabled=true,angle=0;const values=materials.map(m=>m.userData.foliageTransmission.value);const views=[[[3.1,1.6,4.5],[-.15,.65,0]],[[-.4,.9,2.4],[-.55,.4,.25]],[[4,2.5,-2],[0,.7,0]]];function draw(){materials.forEach((m,i)=>m.userData.foliageTransmission.value=enabled?values[i]:0);camera.position.set(...views[angle][0]);camera.lookAt(...views[angle][1]);r.render(scene,camera);document.querySelector('#stats').textContent=JSON.stringify({enabled,angle,proof,calls:r.info.render.calls,triangles:r.info.render.triangles});r.domElement.dataset.proof=JSON.stringify(proof);}
document.querySelector('#before').onclick=()=>{enabled=false;draw();};document.querySelector('#after').onclick=()=>{enabled=true;draw();};document.querySelector('#angle').onclick=()=>{angle=(angle+1)%3;draw();};draw();
}catch(e){document.querySelector('#stats').textContent=e.stack;console.error(e);}
</script>
