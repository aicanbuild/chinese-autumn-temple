<!doctype html><html lang="zh"><meta charset="utf-8"><title>卷叶与落地检查</title><style>body{margin:0;background:#252921;color:#eee;font:15px sans-serif}header{padding:16px}button{padding:8px 18px}canvas{display:block}pre{padding:12px}</style><header>六种落叶形态 · 相同的网页模型和材质 <button id="drop">观察落地摆动</button></header><pre id="result">正在载入…</pre><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js"}}</script><script type="module">
import * as THREE from 'three';import {createFallenLeafGeometry,applyLeafSurface} from '../dist/leaf-surfaces.js';import {setLeafRotation,lowestLeafPoint,leafInstanceColor} from '../dist/leaf-settling.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#252921');const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1100,580);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(38,1100/580,.01,8);camera.position.set(.1,1.05,1.1);camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight('#d4e6f3','#4e483b',1.0));const sun=new THREE.DirectionalLight('#ffeac8',3.2);sun.position.set(-1,2,.6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-1,right:1,top:1,bottom:-1,near:.01,far:5});sun.shadow.bias=-.0001;scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(5,5),new THREE.MeshStandardMaterial({color:'#706959',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const loader=new THREE.TextureLoader(),meshes=[],leaves=[];
for(let kind=0;kind<2;kind++){
 const name=kind===0?'maple':'ginkgo';const [map,normal,surface]=await Promise.all(['','-normal','-surface'].map(s=>loader.loadAsync('../dist/assets/'+name+'-leaf'+s+'.png')));map.colorSpace=THREE.SRGBColorSpace;const material=applyLeafSurface(new THREE.MeshStandardMaterial({map,alphaTest:.42,side:THREE.DoubleSide}),{normal,surface});
 for(let variant=0;variant<3;variant++){const mesh=new THREE.Mesh(createFallenLeafGeometry(kind,variant),material.clone());applyLeafSurface(mesh.material,{normal,surface});mesh.material.color.copy(leafInstanceColor(variant+kind*3));mesh.scale.setScalar(.24);mesh.position.set((variant-1)*.31,0,(kind-.5)*.31);mesh.castShadow=mesh.receiveShadow=true;scene.add(mesh);meshes.push(mesh);leaves.push({state:'rest',landedAt:-Infinity,contactTilt:0,rot:(kind===0?.18:-.2)+variant*.12});}
}
let time=0,start=performance.now(),maxPenetration=0;document.querySelector('#drop').onclick=()=>{leaves.forEach((l,i)=>{l.landedAt=time+i*.08;l.contactTilt=1+i*.55;});};
function animate(now){requestAnimationFrame(animate);time=(now-start)/1000;for(let i=0;i<6;i++){const mesh=meshes[i],leaf=leaves[i];setLeafRotation(leaf,time,mesh.rotation);mesh.position.y=.002-lowestLeafPoint(mesh.geometry,mesh.rotation,.24);}renderer.render(scene,camera);}
const report={variants:6,triangleCounts:meshes.map(m=>m.geometry.index.count/3),contactGapMeters:.002,materials:'existing original botanical albedo, vein normals and roughness',mode:'click to replay the runtime settling pose'};document.querySelector('#result').textContent=JSON.stringify(report,null,2);requestAnimationFrame(animate);
</script></html>
