<script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js","three/addons/":"../dist/vendor/three/addons/"}}</script><h1>相同树林 · 共享前后逐像素验证</h1><pre id="result">加载原始树林模型…</pre><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {createLandscape as before} from './landscape-before-sharing.js';import {createLandscape as after} from '../dist/landscape.js';
const loader=new GLTFLoader(),draco=new DRACOLoader();draco.setDecoderPath('../dist/vendor/three/addons/libs/draco/gltf/');loader.setDRACOLoader(draco);
const [asset,layout]=await Promise.all([loader.loadAsync('../dist/assets/woodland.glb'),fetch('../dist/assets/woodland.json').then(r=>r.json())]);
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(800,500);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);const target=new THREE.WebGLRenderTarget(800,500);
function build(create){const scene=new THREE.Scene();scene.background=new THREE.Color('#a1b9ae');const forest=create(new THREE.Group(),asset.scene,layout,scene);scene.add(new THREE.HemisphereLight('#d6e4ff','#3f4633',1));const sun=new THREE.DirectionalLight('#ffdfad',4);sun.position.set(-24,21,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-50,right:50,top:50,bottom:-50,near:.5,far:150});scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:'#7b855b'}));ground.rotation.x=-Math.PI/2;ground.position.y=-3;ground.receiveShadow=true;scene.add(ground);return {scene,forest};}
const a=build(before),b=build(after),camera=new THREE.PerspectiveCamera(43,1.6,.1,400);
function buffers(forest){const geometry=new Set(forest.batches.map(b=>b.geometry)),materials=new Set(forest.batches.map(b=>b.material));let bytes=0;for(const g of geometry){for(const a of Object.values(g.attributes))bytes+=a.array.byteLength;bytes+=g.index?.array.byteLength??0;}return {trees:forest.trees,batches:forest.batches.length,geometries:geometry.size,materials:materials.size,geometryBytes:bytes};}
function render(state,time){state.forest.update(time);renderer.setRenderTarget(target);renderer.render(state.scene,camera);const pixels=new Uint8Array(800*500*4);renderer.readRenderTargetPixels(target,0,0,800,500,pixels);return {pixels,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles};}
const cases=[];for(const [name,position,look] of [['courtyard',[14,8.5,26],[0,2,0]],['reflection',[14,-8.5,26],[0,-2,0]],['forest edge',[18,3,-20],[45,8,-60]]]){camera.position.fromArray(position);camera.lookAt(...look);for(const time of [0,8]){const x=render(a,time),y=render(b,time);let changed=0,max=0;for(let i=0;i<x.pixels.length;i++){const d=Math.abs(x.pixels[i]-y.pixels[i]);if(d)changed++;max=Math.max(max,d);}cases.push({name,time,changedChannels:changed,maxChannelDifference:max,beforeCalls:x.calls,afterCalls:y.calls,beforeTriangles:x.triangles,afterTriangles:y.triangles});}}
const result={pixelTolerance:"At most one RGB pixel per 800x500 frame may differ at coincident foliage edges after material sorting changes",passed:cases.every(c=>c.changedChannels<=3),before:buffers(a.forest),after:buffers(b.forest),cases};renderer.setRenderTarget(null);renderer.render(b.scene,camera);document.querySelector('#result').textContent=JSON.stringify(result,null,2);document.querySelector('#result').dataset.validation=JSON.stringify(result);draco.dispose();
</script></html>
