import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';import {Water} from 'three/addons/objects/Water2.js';import {installWaterSunlight} from '../dist/water-sunlight.js';import {installLanterns} from '../dist/lanterns.js';import {installPondBasin} from '../dist/pond-basin.js';import {installPondStones} from '../dist/pond-stones.js';import {replaceBridge} from '../dist/bridge.js';import {createKoi,updateKoi} from '../dist/koi.js';import {installPondOptics} from '../dist/pond-optics.js';import {installWaterRefraction} from '../dist/water-refraction.js';import {depthWaterFragment} from '../dist/water-optics.js';import {impactWaterFragment,createPondMotion} from '../dist/pond-motion.js';import {createWaterVisibility} from '../dist/water-visibility.js';import {createWaterCaptureRegion} from '../dist/water-capture-region.js';

function draw(){pondStones.meshes.forEach((m,i)=>m.castShadow=i<6||enabled);waters[0].visible=true;for(const mesh of originalLamps.meshes)mesh.visible=false;for(const mesh of culledLamps.meshes)mesh.visible=true;const views=[[[14,8.5,26],[0,2,0]],[[6,3.1,12],[5,-.7,8.7]],[[5,5,7],[5,-1.3,6]],[[-10,2,-3],[-14,1,-4]],[[.08,2.72,-4.02],[0,2.9,-8.35]],[[-12,5,4],[1,0,6]]];camera.position.set(...views[angle][0]);camera.lookAt(...views[angle][1]);camera.updateProjectionMatrix();renderer.info.reset();renderer.shadowMap.needsUpdate=true;matrixPasses=0;renderSceneFrame(scene,()=>renderer.render(scene,camera));document.querySelector('#result').textContent=JSON.stringify({mode:enabled?'submerged stone shadows':'bank shadows only',matrixPasses,angle,region:regions[0].stats,multiDraw:renderer.extensions.has('WEBGL_multi_draw'),triangles:renderer.info.render.triangles,calls:renderer.info.render.calls});}

 for(const mode of [false,true]){enabled=mode;renderer.setRenderTarget(comparisonTarget);draw();const pixels=new Uint8Array(1280*640*4);renderer.readRenderTargetPixels(comparisonTarget,0,0,1280,640,pixels);const shadow=new Uint8Array(4096*4096*4);renderer.readRenderTargetPixels(sun.shadow.map,0,0,4096,4096,shadow);results.push({pixels,shadow,matrixPasses,triangles:renderer.info.render.triangles,calls:renderer.info.render.calls});}
 const difference=(a,b)=>{let changed=0,max=0,darker=0,lighter=0;for(let i=0;i<a.length;i++){const d=Math.abs(a[i]-b[i]);if(d)changed++;if(i%4<3){if(b[i]<a[i])darker++;else if(b[i]>a[i])lighter++;}max=Math.max(max,d);}return {changedChannels:changed,darkerChannels:darker,lighterChannels:lighter,maxDifference:max,nonzeroBefore:a.reduce((n,v)=>n+(v!==0),0),nonzeroAfter:b.reduce((n,v)=>n+(v!==0),0)};};

 comparisons.push({view,beforeMatrixPasses:results[0].matrixPasses,afterMatrixPasses:results[1].matrixPasses,depth:depthDifference(results[0].shadow,results[1].shadow),beforeTriangles:results[0].triangles,afterTriangles:results[1].triangles,beforeCalls:results[0].calls,afterCalls:results[1].calls,color:difference(results[0].pixels,results[1].pixels),shadow:difference(results[0].shadow,results[1].shadow)});
}
renderer.setRenderTarget(null);enabled=true;angle=2;draw();document.querySelector('#benchResult').textContent=JSON.stringify({multiDraw:renderer.extensions.has('WEBGL_multi_draw'),comparisons},null,2);
document.querySelector('#bench').disabled=true;
}catch(e){document.querySelector('#result').textContent=e.stack;console.error(e);}
