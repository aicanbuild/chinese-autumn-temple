<!doctype html><meta charset="utf-8"><title>林木枝干细化对照</title><style>body{margin:0;background:#30382d;color:#eee;font:12px sans-serif}button,label{margin:6px;padding:7px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js","three/addons/":"../dist/vendor/three/addons/"}}</script><button id="before">原枝干</button><button id="after">细化枝干</button><button id="angle">切换机位</button><button id="species">切换树种</button><label><input id="leaves" type="checkbox" checked>树冠</label><pre id="stats">加载</pre><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';
try{
const r=new T.WebGLRenderer({antialias:true});r.setSize(740,620);r.setPixelRatio(1);r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=.83;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;document.body.append(r.domElement);const scene=new T.Scene();scene.background=new T.Color('#66705c');const cam=new T.PerspectiveCamera(44,740/620,.05,50);
const loader=new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('../dist/vendor/three/addons/libs/draco/gltf/'));const [a,b,hdr]=await Promise.all([loader.loadAsync('../evidence/woodland-before-branches.glb'),loader.loadAsync('../dist/assets/woodland.glb'),new HDRLoader().loadAsync('../dist/assets/autumn-forest.hdr')]);
const pm=new T.PMREMGenerator(r);scene.environment=pm.fromEquirectangular(hdr).texture;scene.environmentIntensity=.8;pm.dispose();hdr.dispose();scene.environmentRotation.y=.7;
for(const asset of [a,b]){scene.add(asset.scene);asset.scene.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;o.material.roughness=.91;o.material.envMapIntensity=.35;for(const k of ['map','normalMap'])if(o.material[k])o.material[k].anisotropy=8;if(o.name.startsWith('Leaves_')){o.material.transparent=false;o.material.depthWrite=true;o.material.alphaTest=.42;o.material.side=T.DoubleSide;}}});}
const unchanged=[];for(let s=0;s<3;s++)for(let lod=0;lod<2;lod++){const old=a.scene.getObjectByName(`Leaves_${s}_${lod}`).geometry,now=b.scene.getObjectByName(`Leaves_${s}_${lod}`).geometry;const report={species:s,lod};for(const key of ['position','normal','uv','color']){const x=old.getAttribute(key)?.array,y=now.getAttribute(key)?.array;report[key]=x?.length===y?.length&&x.every((v,i)=>v===y[i]);}report.index=old.index.array.length===now.index.array.length&&old.index.array.every((v,i)=>v===now.index.array[i]);unchanged.push(report);}for(let s=0;s<3;s++){const old=a.scene.getObjectByName(`Branches_${s}_1`).geometry,now=b.scene.getObjectByName(`Branches_${s}_1`).geometry;const report={farBranches:s};for(const key of ['position','normal','uv']){const x=old.getAttribute(key).array,y=now.getAttribute(key).array;report[key]=x.length===y.length&&x.every((v,i)=>v===y[i]);}report.index=old.index.array.length===now.index.array.length&&old.index.array.every((v,i)=>v===now.index.array[i]);unchanged.push(report);}r.domElement.dataset.crownProof=JSON.stringify(unchanged);
const sun=new T.DirectionalLight('#ffe7c2',5.2);sun.position.set(-24,21,10);sun.target.position.set(0,3,0);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:.1,far:70});sun.shadow.normalBias=.008;scene.add(sun,sun.target,new T.HemisphereLight('#d2e5ee','#3a4329',.3));const ground=new T.Mesh(new T.PlaneGeometry(40,40),new T.MeshStandardMaterial({color:'#65704e',roughness:.95}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
let enabled=true,angle=0,species=0;const views=[[[8,4.5,11],[0,3.6,0]],[[3.4,2.8,4.2],[0,3,0]],[[1.6,.95,2.3],[0,.55,0]]];function draw(){cam.position.set(...views[angle][0]);cam.lookAt(...views[angle][1]);for(const [index,asset] of [a,b].entries()){asset.scene.visible=index===(enabled?1:0);for(let s=0;s<3;s++)for(let l=0;l<2;l++)asset.scene.getObjectByName(`Woodland_${s}_${l}`).visible=s===species&&l===0;asset.scene.traverse(o=>{if(o.name.startsWith('Leaves_'))o.visible=document.querySelector('#leaves').checked;});}r.render(scene,cam);const data={enabled,angle,species,calls:r.info.render.calls,triangles:r.info.render.triangles};document.querySelector('#stats').textContent=JSON.stringify(data);r.domElement.dataset.stats=JSON.stringify(data);}
document.querySelector('#before').onclick=()=>{enabled=false;draw();};document.querySelector('#after').onclick=()=>{enabled=true;draw();};document.querySelector('#angle').onclick=()=>{angle=(angle+1)%3;draw();};document.querySelector('#species').onclick=()=>{species=(species+1)%3;draw();};document.querySelector('#leaves').onchange=draw;draw();
}catch(e){document.querySelector('#stats').textContent=e.stack;console.error(e);}
</script>
