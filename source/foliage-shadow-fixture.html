<!doctype html><html lang="zh"><meta charset="utf-8"><title>风动与投影验证</title><style>body{background:#24342a;color:#ede7d3;font:15px sans-serif}pre{white-space:pre-wrap}canvas{width:720px;height:480px}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js"}}</script><h1>同一叶片：风动投影与实际变形几何对照</h1><pre id="result">正在生成方向光和点光阴影对比…</pre><script type="module">
import * as THREE from 'three';import {applyCanopyWind,applyWoodlandWind,createWindShadows} from '../dist/foliage-wind.js';import {createLeafGeometry} from '../dist/leaf-surfaces.js';
const map=await new THREE.TextureLoader().loadAsync('../dist/assets/maple-leaf.png');map.colorSpace=THREE.SRGBColorSpace;
const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(720,480);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.BasicShadowMap;document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(48,1.5,.1,40);camera.position.set(5,7,9);camera.lookAt(0,1,0);const reports=[];
for(const [name,deform] of [['canopy',applyCanopyWind],['woodland',applyWoodlandWind]])for(const lightType of ['directional','point']){
 const scene=new THREE.Scene();scene.background=new THREE.Color('#9baf8e');const light=lightType==='point'?new THREE.PointLight(0xffffff,80,25):new THREE.DirectionalLight(0xffffff,3);light.position.set(2,7,3);light.castShadow=true;light.shadow.mapSize.set(512,512);light.shadow.bias=0;light.shadow.normalBias=0;light.shadow.camera.near=.1;light.shadow.camera.far=25;if(lightType==='directional'){Object.assign(light.shadow.camera,{left:-4,right:4,top:4,bottom:-4});scene.add(light.target);}scene.add(light,new THREE.HemisphereLight(0xffffff,0x333333,.4));
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.MeshStandardMaterial({color:'#aaaa88'}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
 const base=createLeafGeometry();if(name==='woodland')base.translate(0,3,0);const material=new THREE.MeshStandardMaterial({map,alphaTest:.42,side:THREE.DoubleSide});const time={value:0};material.onBeforeCompile=s=>deform(s,time);const mesh=new THREE.InstancedMesh(base,material,1);mesh.castShadow=true;mesh.frustumCulled=false;
 const transform=new THREE.Object3D();transform.position.set(0,name==='canopy'?3:1,0);transform.rotation.x=name==='canopy'?-Math.PI/2+.3:0;transform.updateMatrix();mesh.setMatrixAt(0,transform.matrix);scene.add(mesh);const shadow=createWindShadows(material,time,deform,name);
 function capture(t,mode){time.value=t;mesh.geometry=base;mesh.customDepthMaterial=mode==='matched'?shadow.depth:undefined;mesh.customDistanceMaterial=mode==='matched'?shadow.distance:undefined;
  if(mode==='cpu'){const g=base.clone(),p=g.attributes.position,root=transform.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);if(name==='canopy'){const gust=Math.sin(t*.48+root.x*.39+root.z*.3)+.35*Math.sin(t*1.4+root.y*2);p.setZ(i,z+gust*.10*(y+.5)**2);}else{const gust=Math.sin(t*.48+root.x*.21+root.z*.19);p.setXYZ(i,x+gust*.035*Math.max(0,y-2),y,z+Math.sin(t*.73+x*1.7+root.z)*.045);}}p.needsUpdate=true;mesh.geometry=g;}
  renderer.render(scene,camera);const target=light.shadow.map,pixels=new Uint8Array(target.width*target.height*4);renderer.readRenderTargetPixels(target,0,0,target.width,target.height,pixels);if(mode==='cpu')mesh.geometry.dispose();return pixels;
 }
 function difference(a,b){let changed=0,mask=0;for(let i=0;i<a.length;i+=4){if(a[i]!==b[i]||a[i+1]!==b[i+1]||a[i+2]!==b[i+2]||a[i+3]!==b[i+3])changed++;const occupied=p=>!(p[i]===255&&p[i+1]===255&&p[i+2]===255&&p[i+3]===255);if(occupied(a)!==occupied(b))mask++;}return {changedPixels:changed,silhouetteDifference:mask};}
 const old0=capture(0,'old'),old8=capture(8,'old'),new0=capture(0,'matched'),new8=capture(8,'matched'),cpu0=capture(0,'cpu'),cpu8=capture(8,'cpu');
 const report={name,lightType,oldMotion:difference(old0,old8),newMotion:difference(new0,new8),reference0:difference(new0,cpu0),reference8:difference(new8,cpu8)};report.passed=report.oldMotion.changedPixels===0&&report.newMotion.changedPixels>10&&report.reference0.silhouetteDifference<=2&&report.reference8.silhouetteDifference<=2;reports.push(report);
 mesh.geometry=base;mesh.customDepthMaterial=shadow.depth;mesh.customDistanceMaterial=shadow.distance;renderer.render(scene,camera);
}
const result={passed:reports.every(r=>r.passed),scope:'Actual RGBA shadow-map pixels; CPU-deformed identical geometry is the independent reference. Shadow silhouette tolerates two boundary pixels.',cases:reports};document.querySelector('#result').textContent=JSON.stringify(result,null,2);document.querySelector('#result').dataset.validation=JSON.stringify(result);
</script></html>
