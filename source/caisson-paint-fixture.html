<!doctype html><html><meta charset="utf-8"><title>藻井彩绘表面对照</title><style>body{margin:0;background:#222;color:#ddd;font:13px monospace}button{margin:6px;padding:8px}pre{white-space:pre-wrap}#benchResult{max-height:120px;overflow:auto}canvas{display:block}</style><script type="importmap">{"imports":{"three":"../dist/vendor/three/three.module.js","three/addons/":"../dist/vendor/three/addons/","../dist/hall-reflections.js":"../dist/hall-reflections.js?v=caisson1"}}</script><button id="before" disabled>原彩绘表面</button><button id="after" disabled>细腻彩绘表面</button><button id="angle" disabled>切换机位</button><pre id="result">加载…</pre><pre id="benchResult"></pre><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';
import {installFineCaisson} from '../dist/fine-caisson.js';import {installSanctuary} from '../dist/sanctuary.js';import {createSanctuaryLighting} from '../dist/sanctuary-lighting.js';import {installIncenseVessel} from '../dist/incense-vessel.js';import {installSanctuaryFloor} from '../dist/sanctuary-floor.js';import {installHallContact} from '../dist/hall-contact.js';import {captureHallReflections} from '../dist/hall-reflections.js';import {installAltarBrocade} from '../dist/altar-brocade.js';import {installDoorBacks} from '../dist/door-backs.js';import {installBoundedLocalLighting} from '../dist/local-lighting.js';installBoundedLocalLighting();

const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(1280,640);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.83;renderer.info.autoReset=false;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.append(renderer.domElement);

const [temple,sanctuary,floor,sculpture,vessel,brocade,doors,fine,layout,hdr,atlas]=await Promise.all(['temple','sanctuary','sanctuary-floor','sculpture','incense-vessel','altar-brocade','door-backs','fine-caisson'].map(n=>loader.loadAsync((['sanctuary','fine-caisson'].includes(n)?'../evidence/paint-original/':'../dist/assets/')+n+'.glb')).concat([fetch('../dist/assets/sanctuary.json').then(r=>r.json()),new HDRLoader().loadAsync('../dist/assets/autumn-forest.hdr'),new T.TextureLoader().loadAsync('../dist/assets/hall-contact-ao.png')]));

const key=createSanctuaryLighting(scene),sun=new T.DirectionalLight('#ffe7c2',5.2),hemi=new T.HemisphereLight('#d2e5ee','#3a4329',.3);sun.position.set(-24,21,10);sun.target.position.set(0,0,-1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:.5,far:75});sun.shadow.bias=-.00035;sun.shadow.normalBias=.027;scene.add(sun,sun.target,hemi);

const snapshot=m=>({roughnessMap:m.roughnessMap,roughness:m.roughness,metalness:m.metalness,normalMap:m.normalMap,normalScale:m.normalScale.clone()});const oldStates=new Map([...ceilingMats].map(m=>[m,snapshot(m)]));
