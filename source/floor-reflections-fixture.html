import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';import {HDRLoader} from 'three/addons/loaders/HDRLoader.js';

const [temple,sanctuary,floor,sculpture,vessel,brocade,doors,layout,hdr,atlas]=await Promise.all(['temple','sanctuary','sanctuary-floor','sculpture','incense-vessel','altar-brocade','door-backs'].map(n=>loader.loadAsync('../dist/assets/'+n+'.glb')).concat([fetch('../dist/assets/sanctuary.json').then(r=>r.json()),new HDRLoader().loadAsync('../dist/assets/autumn-forest.hdr'),new T.TextureLoader().loadAsync('../dist/assets/hall-contact-ao.png')]));
const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromEquirectangular(hdr).texture;pmrem.dispose();hdr.dispose();scene.environmentRotation.y=.7;scene.environmentIntensity=.8;
temple.scene.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true;});scene.add(temple.scene);installSanctuaryFloor(temple.scene,floor.scene,scene);const contact=installHallContact(floor.scene,atlas);installSanctuary(temple.scene,sanctuary.scene,layout,scene).update(12);installIncenseVessel(temple.scene,vessel.scene,scene);installAltarBrocade(brocade.scene,scene);installDoorBacks(doors.scene,sanctuary.scene,scene);sculpture.scene.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=true;});scene.add(sculpture.scene);

const probe=captureHallReflections(renderer,scene,[sanctuary.scene,floor.scene,sculpture.scene,vessel.scene,brocade.scene],{exclude:[sculpture.scene,vessel.scene],specularRoots:[floor.scene],projections:new Map([[floor.scene,{min:new T.Vector3(-6.14,.939,-10.74),max:new T.Vector3(6.14,4.3,-3.46)}]])});
const views=[[[.08,2.72,-4.02],[0,2.9,-8.35],66],[[-2.4,1.8,-5.9],[-2.4,1.07,-7.7],55],[[2.4,1.8,-5.9],[2.4,1.07,-7.7],55],[[0,1.8,-6.5],[0,1.1,-8.15],58]],camera=new T.PerspectiveCamera(66,2,.09,420);let angle=0,enabled=true;
const uniforms=[];
for(const mesh of contact.meshes){const compile=mesh.material.onBeforeCompile;mesh.material.onBeforeCompile=function(shader,...args){compile.call(this,shader,...args);shader.uniforms.hallSpecularMap.value=enabled?probe.specularTarget.texture:probe.target.texture;shader.uniforms.verifySpecularWeight={value:1};shader.fragmentShader='uniform float verifySpecularWeight;\n'+shader.fragmentShader;shader.fragmentShader=shader.fragmentShader.replace('return envMapColor.rgb * envMapIntensity;','return envMapColor.rgb * envMapIntensity * verifySpecularWeight;');uniforms.push(shader.uniforms);};}
function draw(){for(const u of uniforms)u.hallSpecularMap.value=enabled?probe.specularTarget.texture:probe.target.texture;camera.position.set(...views[angle][0]);camera.lookAt(...views[angle][1]);camera.fov=views[angle][2];camera.updateProjectionMatrix();renderer.shadowMap.needsUpdate=true;key.key.shadow.needsUpdate=true;renderer.info.reset();renderer.render(scene,camera);document.querySelector('#result').textContent=JSON.stringify({mode:enabled?'furnished reflections':'room only',angle,...probe.stats,triangles:renderer.info.render.triangles,calls:renderer.info.render.calls});}
function difference(a,b){let changed=0,darker=0,lighter=0,max=0;for(let i=0;i<a.length;i++){const d=b[i]-a[i];if(d){changed++;if(d<0)darker++;else lighter++;max=Math.max(max,Math.abs(d));}}return {changedChannels:changed,darkerChannels:darker,lighterChannels:lighter,maxDifference:max};}
